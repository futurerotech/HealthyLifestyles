name: Verify repair branches

on:
  push:
    branches: [dev, 'codex/**']
  # P15 close — run the full verify gate on PRs to dev too (Lighthouse blocking,
  # empty-shell, date-integrity, etc.). The promote job stays push-only.
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regenerate-review-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/seo-wellness-tag-sitemap-20261031'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-wellness-tag-sitemap-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile on isolated branch
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify updated dependency tree
        run: |
          npm ci --ignore-scripts
          npm ls glob minimatch
          npm audit --audit-level=high
      - name: Commit review lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "fix(security): lock patched transitive packages"
          git push origin HEAD:fix/seo-wellness-tag-sitemap-20261031
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Release policy: unresolved high/critical vulnerabilities block promotion,
      # including previously baselined advisories. Framework upgrades are separate.
      - name: Security release gate
        run: npm run security:check

      # Temporary read-only evidence: inventory current advisory IDs without
      # renewing the expired human-reviewed risk ledger or relaxing the gate.
      - name: Capture current advisory inventory for security review
        run: |
          npm audit --json > "$RUNNER_TEMP/hls-audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/hls-audit.json","utf8"));
            const entries=new Map();
            for (const [pkg,v] of Object.entries(a.vulnerabilities || {}))
              for (const x of v.via || []) if(x && typeof x === "object" && typeof x.source === "number")
                entries.set(x.source, {id:x.source,severity:x.severity,package:x.name||pkg,title:x.title});
            console.log("HLS_CURRENT_AUDIT_TOTALS="+JSON.stringify(a.metadata?.vulnerabilities));
            console.log("HLS_CURRENT_AUDIT_ADVISORIES="+JSON.stringify([...entries.values()].sort((x,y)=>x.id-y.id)));
          '

      # Targeted regression proof runs without renewing expired accepted risk.
      # The full build remains blocked by audit-delta until security review.
      - name: Tag sitemap route contract (independent of security exception)
        run: node --test scripts/seo/__tests__/site-contract.test.ts

      - name: Isolated CMS fixture sitemap build (security gate remains blocking)
        env:
          CMS_DISABLE: '1'
          INDEXNOW_DISABLE: 'true'
        run: npm run test:cms-build

      # Keep the existing advisory ledger review guard as an additional check.
      - name: Audit delta (new high/critical only)
        run: node scripts/ci/audit-delta.ts

      - name: Type check
        run: npx tsc --noEmit

      # P15 unit proofs (pre-build): D5 date integrity (feed) + P6 i18n rails +
      # empty-shell detector logic. Node 22 runs .ts under --test natively.
      - name: SEO unit tests (D5 feed + P6 i18n + empty-shell)
        run: npm run test:seo

      - name: Subscription and native share-image API tests
        run: npm run test:api

      - name: Build and verify CMS integration
        env:
          CMS_DISABLE: '1'
          INDEXNOW_DISABLE: 'true'
        run: npm run test:cms-build

      - name: Content preservation regression tests
        run: npm run test:content

      # Fixture/offline success never authorizes promotion. This independent
      # production-data build must preserve every current published ID and slug.
      - name: Build complete published CMS content and run release preflight
        env:
          CMS_URL: 'https://cms.healthylifesstyles.com'
          CMS_DISABLE: '0'
          VERCEL_ENV: 'production'
          INDEXNOW_DISABLE: 'true'
        run: npm run build

      - name: Internal-link audit
        run: node scripts/seo/orphan-check.ts

      - name: JSON-LD validation
        run: node scripts/seo/validate-jsonld.ts

      # P15 / D5+D8+SD3 — BLOCKING: scans built rss.xml + sitemap <lastmod> +
      # all JSON-LD for the fabrication fingerprint (≥2 editorial dates at
      # build execution time) and validates the canonical feed's RSS structure.
      - name: Date-integrity guard (D5/D8)
        run: npm run seo:dates

      # P15-P6 — BLOCKING: no untranslated/placeholder localized pages may ship.
      - name: Empty-shell detector (P6)
        run: npm run seo:shells

      # P16 B/C/K — BLOCKING on high-confidence metadata defects (missing/dup
      # title/canonical/description, canonical collisions, broken hreflang
      # reciprocity); length ranges are ADVISORY warnings only.
      - name: Metadata audit (P16)
        run: npm run seo:meta

      # P16-G — evidence-based HTML/DOM/hydration regression budgets
      # (baseline: /tools = 27.1KB gzip, 1722 tags, 0 islands).
      - name: Size budgets (P16)
        run: npm run seo:budgets

      # P15-P4b — non-blocking by design (script always exits 0): flags
      # article images provably below the 1200px Discover threshold and
      # refreshes docs/seo/discover-audit.md.
      - name: Discover image audit (non-blocking)
        run: npm run seo:discover

      # P15-P5a — CWV lab budget (LCP≤2.0s, CLS≤0.05, TBT≤200ms as INP lab
      # proxy). BLOCKING since the human-approved baseline (Phase-15 closure
      # Gate-0). @lhci/cli is npx-fetched in CI only — not a repo dep.
      - name: Lighthouse CWV budget (blocking)
        run: npx --yes @lhci/cli@0.14.x autorun

      # Phase 9 P3 — external Rich Results validation. Best-effort and NON-BLOCKING:
      # the script always exits 0, and continue-on-error guarantees an external API
      # limit/timeout can never fail verify or strand the auto-promotion.
      - name: Rich Results check (non-blocking)
        run: node scripts/seo/rich-results-check.ts
        continue-on-error: true
