name: Guard evidence (not for merge)

# Evidence-only branch: runs the guard PR's own unit tests and its full production-data
# build (prebuild npm audit --audit-level=high, astro build, postbuild preflight with the
# pre-release content lock) against the live production CMS. It does not replace, skip or
# alter the main CI security gates; the guard PR (#57) still runs them unchanged.
on:
  push:
    branches: ['codex/guard-evidence-20261115']

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit inventory for Issue #52 (evidence only; the gate in main CI is unchanged)
        run: |
          npm audit --json > audit.json || true
          node -e '
            const a = require("./audit.json"), b = require("./audit-baseline.json");
            const base = new Set(b.advisories.map((x) => x.id));
            const rows = new Map();
            for (const [pkg, v] of Object.entries(a.vulnerabilities || {})) for (const via of v.via || []) if (via && typeof via === "object") {
              const r = rows.get(via.source) || { id: via.source, severity: via.severity, package: via.name, title: via.title, url: via.url, range: via.range, paths: [], fix: v.fixAvailable };
              r.paths.push(pkg); rows.set(via.source, r);
            }
            const cur = [...rows.values()].sort((x, y) => x.id - y.id);
            console.log("npm totals:", JSON.stringify(a.metadata.vulnerabilities));
            for (const r of cur) console.log([base.has(r.id) ? "BASELINED" : "NEW", r.severity, r.id, r.package, r.range, typeof r.fix === "object" ? "fix:" + r.fix.name + "@" + r.fix.version + (r.fix.isSemVerMajor ? " (major)" : "") : "fix:" + r.fix, r.url, r.title].join(" | "));
            for (const id of base) if (!rows.has(id)) console.log("RESOLVED since baseline |", id, "|", b.advisories.find((x) => x.id === id).package);
          '
      - name: Non-breaking audit fix candidate (lockfile only; reviewed and committed by hand)
        run: |
          cp package.json package.json.orig; cp package-lock.json package-lock.json.orig
          npm audit fix --package-lock-only --ignore-scripts || true
          git diff --stat -- package.json package-lock.json
          npm audit --json --package-lock-only > audit-after.json || true
          node -e 'console.log("after fix:", JSON.stringify(require("./audit-after.json").metadata.vulnerabilities))'
          mkdir -p fix && cp package.json package-lock.json audit.json audit-after.json fix/
          mv package.json.orig package.json; mv package-lock.json.orig package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: audit-inventory
          path: fix/
      - name: Guard unit tests
        run: node --test scripts/seo/__tests__/release-guard.test.mjs
      - name: Production-data build exactly as Vercel runs it (npm run build lifecycle)
        env:
          CMS_URL: 'https://cms.healthylifesstyles.com'
          CMS_DISABLE: '0'
          VERCEL_ENV: 'production'
          INDEXNOW_DISABLE: 'true'
        run: npm run build
