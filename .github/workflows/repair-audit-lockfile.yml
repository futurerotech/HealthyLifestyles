name: Repair audit lockfile (isolated, no force)

on:
  push:
    branches:
      - fix/security-audit-vercel-20261028
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve narrowly scoped safe dependency override into lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Record baseline audit
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npm audit --json > audit-before.json || true
      - name: Verify lockfile remediation without force
        run: npm audit --audit-level=high
      - name: Reinstall exact repaired lockfile
        run: npm ci --ignore-scripts
      - name: Verify high-severity audit gate
        run: |
          npm audit --json > audit-after.json || true
          npm audit --audit-level=high
      - name: Test complete published CMS build (read-only)
        env:
          CMS_URL: 'https://cms.healthylifesstyles.com'
          CMS_DISABLE: '0'
          VERCEL_ENV: 'production'
          INDEXNOW_DISABLE: 'true'
        run: npm run build
      - name: Commit ONLY validated lockfile to this repair branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): resolve high-severity npm advisories without force"
            git push origin HEAD:fix/security-audit-vercel-20261028
          fi
      - name: Attach redacted audit reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-diagnostics
          path: |
            audit-before.json
            audit-after.json
          if-no-files-found: ignore
          retention-days: 7
