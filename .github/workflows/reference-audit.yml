name: Reference integrity audit (Phase 3 §7.4)

# Read-only audit of the sources cited by published articles. It never blocks
# releases and writes nothing to the CMS. It runs only when the audit itself
# changes, or on request.
on:
  pull_request:
    paths:
      - 'scripts/content/reference-audit.mjs'
      - 'scripts/content/editorial-lint.mjs'
      - 'scripts/content/overlap-audit.mjs'
      - 'scripts/content/verify-correction-packages.mjs'
      - 'scripts/content/correction-packages/**'
      - 'scripts/content/release-content-lock.*'
      - '.github/workflows/reference-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit cited sources
        run: node scripts/content/reference-audit.mjs
      - name: Editorial lint (§7.3/§7.5)
        if: always()
        run: node scripts/content/editorial-lint.mjs
      - name: Overlap and cannibalization screen (Phase 7 §11.3)
        if: always()
        run: node scripts/content/overlap-audit.mjs
      - name: Verify draft correction packages against live records (in memory only)
        if: always()
        run: node scripts/content/verify-correction-packages.mjs
      - name: Release content lock digests for the 16 records (read-only)
        if: always()
        run: node scripts/content/release-content-lock.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-audit
          path: |
            reference-audit.json
            editorial-lint.json
            overlap-audit.json
          retention-days: 30
