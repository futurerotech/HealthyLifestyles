name: Regenerate security lockfile on isolated review branch
on:
  workflow_dispatch:
  push:
    branches:
      - fix/seo-wellness-tag-sitemap-20261031
    paths:
      - package.json
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'futurerotech/HealthyLifestyles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without installing or running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate patched dependencies and install
        run: |
          npm ci --ignore-scripts --no-fund
          npm ls glob minimatch @vercel/nft
          npm audit --audit-level=high
      - name: Commit lockfile only if regenerated
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m "fix(security): lock patched glob and minimatch dependency tree"
          git push origin "HEAD:fix/seo-wellness-tag-sitemap-20261031"
